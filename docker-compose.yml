services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: meta-account-manager-backend:latest
    container_name: meta-account-manager-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: meta-account-manager-frontend:latest
    container_name: meta-account-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:80"
