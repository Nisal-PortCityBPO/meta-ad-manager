name: Dev - Build, Push to GHCR and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: ver
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$VERSION" ]; then
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (FIXED GHCR PACKAGE NAME)
        id: image
        run: echo "image=ghcr.io/${{ github.repository_owner }}/meta-add" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.image }}:dev
            ${{ steps.image.outputs.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [version, build]

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/meta-add
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: 22
          envs: VERSION,IMAGE
          script: |
            cd /var/www

            echo "🚀 Deploying meta-add:$VERSION"

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            docker pull $IMAGE:$VERSION

            docker tag $IMAGE:$VERSION $IMAGE:current

            docker tag $IMAGE:$VERSION $IMAGE:dev

            ./deploy_meta_app.sh "$VERSION"
