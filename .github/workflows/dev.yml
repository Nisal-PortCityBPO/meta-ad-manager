name: Dev - Build, Push to GHCR and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version (NO BRANCHES)
        id: ver
        run: |
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (LOWERCASE SAFE GHCR)
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/meta-add" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.image }}:dev
            ${{ steps.image.outputs.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [version, build]

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: 22
          envs: VERSION,OWNER
          script: |
            cd /var/www

            OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/$OWNER_LC/meta-add"

            echo "🚀 Deploying $IMAGE:$VERSION"

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            docker pull $IMAGE:$VERSION

            docker tag $IMAGE:$VERSION $IMAGE:current
            docker tag $IMAGE:$VERSION $IMAGE:dev

            ./deploy_meta_app.sh "$VERSION"